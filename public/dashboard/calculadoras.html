<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/dashboards.css">
    <script src="./js/sessao.js"></script>
</head>

<body>
    <div class="janela">
    <div class="header-left">
        <h1>Musculação <span>sem Mitos</span></h1>
        <div class="hello">
            <h3>Olá, <span id="b_usuario">Capitão</span>!</h3>
        </div>
        <div class="navegacao">
            <div class="btn-nav">
            <a href="dashboard.html"><h3>Dashboard</h3></a>
            </div>

            <div class="btn-nav">
            <a href="videos.html"><h3>Material Explicativo</h3></a>
            </div>

            <div class="btn-nav">
            <a href="calculadoras.html"><h3>Calculadoras</h3></a>
            </div>

            <div class="btn-nav">
            <a href="forum.html"><h3>Fórum</h3></a>
            </div>
        </div>
        
        <div class="btn-logout" onclick="limparSessao()">
            <h3>Sair</h3>
        </div>
    </div>
    <div class="dash">
        <!-- Conteúdo principal e gráficos aqui -->
         <h1>Calculadoras</h1>
         <div class="secao-calculadora">
            <div class="card-video card-calc">
                <h2>Calcule o seu IMC:</h2>
                <div class="conteudo-calc">
                    <h3>
                        Insira seu peso (KG):
                        <input type="number" placeholder="Ex: 80 KG" id="iptPesoIMC">
                    </h3>
                    <h3>
                        Insira sua altura (Metros):
                        <input type="number" placeholder="Ex: 170 m" id="iptAlturaIMC">
                    </h3>
                </div>
                <button onclick="calcularIMC()">Calcular</button>
                <div id="resultadoIMC"></div>
            </div>

            <div class="card-video card-calc">
                <h2>Quantos litros de água você deve beber por dia?</h2>
                <div class="conteudo-calc">
                    <h3>
                        Insira seu peso (KG):
                        <input type="number" placeholder="Ex: 80 KG" id="iptPesoAgua">
                    </h3>
                </div>
                <button onclick="calcularAgua()">Calcular</button>
                <div id="resultadoAgua"></div>
            </div>
         </div>
    </div>
</div>
</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function calcularIMC() {
        let peso = Number(iptPesoIMC.value);
        let altura = Number(iptAlturaIMC.value);

        if (peso <= 0 || altura <= 0) {
            alert("Por favor, insira valores válidos para peso e altura!");
        } else {
            if (altura > 3) {
                altura = altura / 100;
            }

            let imc = peso / (altura * altura);
            let classificacao = "";
            let cor = "";

            if (imc <= 18.5) {
                classificacao = "abaixo do peso ideal";
                cor = "#f39c12";
            } else if (imc <= 24.9) {
                classificacao = "com o peso ideal";
                cor = "#27ae60";
            } else if (imc <= 29.9) {
                classificacao = "com sobrepeso";
                cor = "#e67e22"; 
            } else {
                classificacao = "com obesidade";
                cor = "#c0392b";
            }

            resultadoIMC.style.display = "flex";
            resultadoIMC.innerHTML = `
                <span style="font-size: 14px; color: #666;">Seu IMC calculado é:</span>
                <b style="font-size: 36px; color: #153fc9; margin: 10px 0;">${imc.toFixed(2)}</b>
                <span style="font-size: 18px; color: ${cor}; font-weight: bold;">
                    Você está ${classificacao}.
                </span>
            `;
        }
    }

    function calcularAgua() {
        let peso = Number(iptPesoAgua.value);

        if (peso <= 0) {
            alert("Por favor, insira um valor válido para peso!");
        } else {
            let litros = peso * 0.035;

            resultadoAgua.style.display = "flex";
            resultadoAgua.innerHTML = `
                <span style="font-size: 14px; color: #666;">Com base no seu peso, você deve beber aproximadamente:</span>
                <b style="font-size: 36px; color: #153fc9; margin: 10px 0;">${litros.toFixed(2)} litros</b>
                <span style="font-size: 18px; color: #27ae60; font-weight: bold;">
                    de água por dia.
                </span>
            `;
        }
    }
</script>
