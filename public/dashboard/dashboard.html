<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musculação sem Mitos | Dashboard</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/dashboards.css">
    <script src="../js/sessao.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="janela">
        <div class="header-left">
            <h1>Musculação <span>sem Mitos</span></h1>
            <div class="hello">
                <h3>Olá, <span id="b_usuario">User</span>!</h3>
            </div>
            <div class="navegacao">
                <div class="btn-nav nestaPagina">
                    <a href="dashboard.html">
                        <img src="../assets/icon/icon-home.png" alt=""><h3>Dashboard</h3>
                    </a>
                </div>

                <div class="btn-nav">
                    <a href="videos.html">
                        <h3 style="color: black;">Material Explicativo</h3>
                    </a>
                </div>

                <div class="btn-nav">
                    <a href="calculadoras.html">
                        <h3 style="color: black;">Calculadoras</h3>
                    </a>
                </div>

                <div class="btn-nav">
                    <a href="forum.html">
                        <h3 style="color: black;">Fórum</h3>
                    </a>
                </div>
            </div>
            <hr>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>
        <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
        <div class="dash">
            <!-- Conteúdo principal e gráficos aqui -->
            <div class="divBaloes">
                <div class="balao-dash">
                    <p>&bull; Seu objetivo é: <span id="balaoStatus"></span></p>
                </div>

                <a href="#cardAlterarPeso" title="editar ícones" onclick="abrirCardAlterarPeso()">
                    <div class="balaoPeso-dash">
                        <img src="../assets/icon/botao-editar.png" alt="">
                        <p>Registrar seu novo peso</p>
                    </div>
                </a>
            </div>


            <div class="secao-kpi">
                <div class="card-kpi">
                    <h3>Peso atual:</h3>
                    <div id="pesoAtual"></div>
                    <p>Data: <span id="dataRegistro"></span></p>
                </div>

                <div class="card-kpi">
                    <h3>Quantos KG faltam para sua meta:</h3>
                    <div id="pesoProgresso"></div>
                </div>

                <div class="card-kpi">
                    <h3>Quantos dias faltam para sua meta:</h3>
                    <div id="diasRestantes"></div>
                </div>
            </div>


            <div id="graficos">
                <h3>Evolução do Peso</h3>
                <canvas id="myChartCanvas"></canvas>
            </div>

            <div id="cardAlterarPeso" class="cardAlterarPeso" style="display: none;">
                <h1>Registre seu novo peso:</h1>
                <h3>
                    Novo peso:
                    <input type="number" name="" id="iptNovoPeso">
                </h3>
                <button onclick="atualizarPeso()">Atualizar</button>
            </div>


        </div>
    </div>
</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    let proximaAtualizacao;
    let idUsuario = sessionStorage.ID_USUARIO;

    if (sessionStorage.ID_USUARIO == undefined) {
        window.location.href = "../login.html";
    }

    function exibirPesoAtual() {
        fetch(`/ultimoPeso/buscarUltimoPeso/${sessionStorage.ID_USUARIO}`, { cache: 'no-store' }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (novoRegistro) {
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);

                    pesoAtual.innerHTML = `${novoRegistro[0].peso}kg`
                    dataRegistro.innerHTML = `${novoRegistro[0].dataRegistro}`
                })
            } else {
                console.log(`Erro ao buscar peso atual.`);
            }
        })
    }

    function exibirMetaAtual() {
        var idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/ultimoPeso/buscarMetaPeso/${idUsuario}`, { cache: 'no-store' }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (metaPesoAtual) {
                    console.log(`Dados recebidos: ${JSON.stringify(metaPesoAtual)}`);

                    let pAtual = metaPesoAtual[0].pesoAtual;
                    let pDesejado = metaPesoAtual[0].pesoDesejado;
                    let pesoRestante = Math.abs(pAtual - pDesejado);

                    if (metaPesoAtual[0].diasParaMeta <= 0) {
                        metaPesoAtual[0].diasParaMeta = 'Finalizada'
                    }

                    pesoProgresso.innerHTML = `${pesoRestante.toFixed(1)}kg`;
                    diasRestantes.innerHTML = `${metaPesoAtual[0].diasParaMeta} dias`;
                    balaoStatus.innerHTML = `<b>${metaPesoAtual[0].objetivo}</b>`
                })
            }
        })
    }

    // O gráfico é construído com três funções:
    // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
    // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
    // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

    // Esta função *obterDadosGrafico* busca os últimos dados inseridos em tabela de medidas.
    // para, quando carregar o gráfico da primeira vez, já trazer com vários dados.
    // A função *obterDadosGrafico* também invoca a função *plotarGrafico*

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function obterDadosGrafico(idUsuario) {

        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/ultimoPeso/buscarUltimosRegistrosPeso/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGrafico(resposta, idUsuario);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
    // Configura o gráfico (cores, tipo, etc), materializa-o na página e, 
    // A função *plotarGrafico* também invoca a função *atualizarGrafico*
    function plotarGrafico(resposta, idUsuario) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Peso',
                data: [],
                fill: true,
                borderColor: 'rgb(0, 0, 139)',
                backgroundColor: 'rgba(75, 91, 192, 0.1)',
                tension: 0.1
            },
                // {
                //     label: 'Temperatura',
                //     data: [],
                //     fill: false,
                //     borderColor: 'rgb(199, 52, 52)',
                //     tension: 0.1
                // }
            ]
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.data_grafico);
            dados.datasets[0].data.push(registro.peso);
            //dados.datasets[1].data.push(registro.temperatura);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'line',
            data: dados,
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById(`myChartCanvas`),
            config
        );

        setTimeout(() => atualizarGrafico(idUsuario, dados, myChart), 2000);
    }


    // Esta função *atualizarGrafico* atualiza o gráfico que foi renderizado na página,
    // buscando a última medida inserida em tabela contendo as capturas, 

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function atualizarGrafico(idUsuario, dados, myChart) {



        fetch(`/ultimoPeso/buscarUltimosRegistrosPeso/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    // alertar(novoRegistro, idUsuario);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);

                    // let avisoCaptura = document.getElementById(`avisoCaptura${idUsuario}`)
                    // avisoCaptura.innerHTML = ""


                    if (novoRegistro[0].data_grafico == dados.labels[dados.labels.length - 1]) {
                        console.log("---------------------------------------------------------------")
                        console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                        //avisoCaptura.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Foi trazido o dado mais atual capturado pelo sensor. <br> Como não há dados novos a exibir, o gráfico não atualizará."
                        console.log("Horário do novo dado capturado:")
                        console.log(novoRegistro[0].data_grafico)
                        console.log("Horário do último dado capturado:")
                        console.log(dados.labels[dados.labels.length - 1])
                        console.log("---------------------------------------------------------------")
                    } else {
                        // tirando e colocando valores no gráfico

                        if (dados.labels.length >= 7) {
                            dados.labels.shift(); // apagar o primeiro
                            dados.datasets[0].data.shift();  // apagar o primeiro de umidade
                        }

                        dados.labels.push(novoRegistro[0].data_grafico); // incluir um novo momento
                        dados.datasets[0].data.push(novoRegistro[0].peso); // incluir uma nova medida de umidade

                        // dados.datasets[1].data.shift();  // apagar o primeiro de temperatura
                        // dados.datasets[1].data.push(novoRegistro[0].temperatura); // incluir uma nova medida de temperatura

                        myChart.update();
                    }

                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(idUsuario, dados, myChart), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => atualizarGrafico(idUsuario, dados, myChart), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }


    function abrirCardAlterarPeso() {
        cardAlterarPeso.style.display = 'block';
    }

    function atualizarPeso() {
        var pesoNovoVar = Number(iptNovoPeso.value);

        if (pesoNovoVar == '') {
            alert('Seu peso não pode estar vazio.');
        } else if (pesoNovoVar < 20) {
            alert('Seu peso não pode ser menor que 20Kg');
        } else if (pesoNovoVar > 400) {
            alert('Seu peso novo não pode ser superior a 400Kg.');
        } else {
            fetch("/alterarPesoAtual/atualizarPesoAtual", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    pesoNovoServer: pesoNovoVar,
                    idUsuario: sessionStorage.ID_USUARIO
                }),
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        cardErro.style.display = "block";
                        mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando...";
                        setTimeout(() => {
                            window.location = "dashboard.html";
                        }, "2000");
                    } else {
                        throw "Houve um erro ao tentar realizar o cadastro!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

            return false;
        }
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }

    window.onload = function () {
        exibirPesoAtual();
        exibirMetaAtual();
        obterDadosGrafico(idUsuario);
    }
</script>
